LABEL arch
TEXT HELP
Boot the SpeedyOS live on BIOS.
It allows you to install SpeedyOS or perform system maintenance.
ENDTEXT
MENU LABEL SpeedyOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the SpeedyOS live on BIOS with speakup screen reader.
It allows you to install SpeedyOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL SpeedyOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
