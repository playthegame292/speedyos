# SpeedyOS Calamares configuration (Calamares 3.4)
# Fast Paws. Arch Power.
#
# Module configs live in /etc/calamares/modules; anything not overridden there
# falls back to the upstream defaults in /usr/share/calamares/modules.
---
modules-search: [ local ]

instances:
  - id:     finalize
    module: shellprocess
    config: shellprocess-finalize.conf
  - id:     wipestale
    module: shellprocess
    config: shellprocess-wipestale.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@wipestale
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - removeuser
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@finalize
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: speedyos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
