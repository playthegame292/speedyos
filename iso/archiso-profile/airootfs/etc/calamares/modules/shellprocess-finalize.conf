# Turns the unpacked live image into an installed system (runs in the chroot).
# See /usr/local/lib/speedyos/finalize-install for what it does.
---
dontChroot: false
timeout: 600
verbose: true
script:
    - command: "/usr/local/lib/speedyos/finalize-install"
      timeout: 600
i18n:
    name: "Finishing SpeedyOS setup (kernel, live-session cleanup, pacman keys)"
