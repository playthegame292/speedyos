# User account and hostname for the installed system.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - audio
    - network
    - storage
    - optical
    - input
    - power
    - name: wheel
      must_exist: false
      system: true
sudoersGroup:    wheel
sudoersConfigureWithGroup: false
autologinGroup:  autologin
doAutologin:     false
displayAutologin: false
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, speedyuser ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "speedyos-${cpu}"
  forbidden_names: [ localhost ]
