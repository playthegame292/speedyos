# Disk partitioning. Nothing is preselected: the user must explicitly pick
# a disk and an action (erase / alongside / replace / manual) before anything
# is written, and the summary page lists every change before installation.
---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     32MiB
    label:           "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small

luksGeneration: luks1
enableLuksAutomatedPartitioning: true

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
# Partition table: Calamares picks GPT on UEFI and MBR on BIOS when erasing.

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
