# systemd units on the installed system. The live image's enabled units are
# copied along with the filesystem; this makes the important ones explicit.
---
units:
  - name: "sddm.service"
    action: "enable"
    mandatory: true
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "systemd-resolved.service"
    action: "enable"
    mandatory: true
  - name: "systemd-timesyncd.service"
    action: "enable"
  - name: "bluetooth.service"
    action: "enable"
  - name: "fstrim.timer"
    action: "enable"
  - name: "graphical.target"
    action: "set-default"
    mandatory: true
