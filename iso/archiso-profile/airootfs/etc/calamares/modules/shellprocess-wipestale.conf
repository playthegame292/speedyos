# Removes leftover filesystem signatures (e.g. an old ext4 under the new btrfs)
# that make grub-mkconfig fail. Runs on the host, right after "mount".
---
dontChroot: true
timeout: 60
verbose: true
script:
    - command: "/usr/local/lib/speedyos/wipe-stale-signatures ${ROOT}"
      timeout: 60
i18n:
    name: "Cleaning up old filesystem signatures"
