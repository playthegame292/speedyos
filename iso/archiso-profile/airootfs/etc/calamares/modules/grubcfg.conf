# /etc/default/grub for the installed system. GRUB_DISTRIBUTOR comes from
# branding (bootloaderEntryName).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "1920x1080,1280x720,1024x768,auto"
    GRUB_THEME: "/usr/share/grub/themes/speedyos/theme.txt"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
