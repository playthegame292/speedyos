# Copy the live root filesystem to the target.
# /run/archiso/airootfs is the read-only squashfs mounted by the archiso
# initramfs. Using it (instead of the .sfs file on the boot medium) works
# both when booting from DVD/USB and with copytoram, where the boot medium
# is unmounted after the image is copied into RAM.
# sourcefs "file" = copy a directory tree with rsync. ("squashfs" would expect
# the .sfs file itself: it counts files with "unsquashfs -l <source>".)
---
unpack:
    -   source: "/run/archiso/airootfs"
        sourcefs: "file"
        destination: ""
