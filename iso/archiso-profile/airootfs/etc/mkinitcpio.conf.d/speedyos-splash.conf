# SpeedyOS boot splash: add the plymouth hook right after udev (or systemd),
# before any hook that may ask for a disk password. Drop-ins are appended to
# mkinitcpio.conf, so this works with whatever HOOKS the system defines.
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
    _speedyos_hooks=()
    for _hook in "${HOOKS[@]}"; do
        _speedyos_hooks+=("$_hook")
        [[ $_hook == udev || $_hook == systemd ]] && _speedyos_hooks+=(plymouth)
    done
    HOOKS=("${_speedyos_hooks[@]}")
    unset _hook _speedyos_hooks
fi
