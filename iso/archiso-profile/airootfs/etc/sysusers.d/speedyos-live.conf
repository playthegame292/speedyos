# SpeedyOS live session user groups.
# The live user itself is defined in /etc/passwd + /etc/shadow (archiso style);
# group IDs for system groups are left to systemd-sysusers so they match Arch.
# LIVE ONLY: the Calamares cleanup step deletes this file on the installed system.
g speedyuser 1000
m speedyuser wheel
m speedyuser audio
m speedyuser video
m speedyuser input
m speedyuser storage
m speedyuser network
m speedyuser power
m speedyuser optical
m speedyuser lp
m speedyuser users
